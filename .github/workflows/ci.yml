# CI: every push to main and every pull request.
#
#   web          lint + typecheck the Next.js app
#   etl          Python parser tests (no database needed)
#   integration  real MySQL + Neo4j from docker-compose.yml, built only from
#                the init scripts in db/mysql/, then:
#                  - constraint tests (every bad statement rejected, every P-test PASS)
#                  - the app user cannot run DDL (least privilege)
#                  - Neo4j constraints, demo users, refresher image build
#                  - production build of the web app, started and checked
#                    over HTTP: health, sign-in, session
#
# No real data is downloaded; the schema, routines and triggers are what is tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  etl:
    name: ETL (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q etl
      - name: Parser tests
        run: python -m unittest discover -s etl/tests -t . -v

  integration:
    name: Integration (MySQL, Neo4j, app)
    runs-on: ubuntu-latest
    needs: [web, etl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create a throwaway .env
        run: |
          pw() { openssl rand -hex 16; }
          ROOT=$(pw); APP=$(pw); NEO=$(pw); SECRET=$(openssl rand -hex 32)
          ADMIN=$(pw); ANALYST=$(pw)
          for s in "$ROOT" "$APP" "$NEO" "$SECRET" "$ADMIN" "$ANALYST"; do echo "::add-mask::$s"; done
          cat > .env <<EOF
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3307
          MYSQL_DATABASE=threatlattice
          MYSQL_ROOT_PASSWORD=$ROOT
          MYSQL_APP_USER=tl_app
          MYSQL_APP_PASSWORD=$APP
          NEO4J_URI=bolt://127.0.0.1:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=$NEO
          AUTH_SECRET=$SECRET
          SEED_ADMIN_PASSWORD=$ADMIN
          SEED_ANALYST_PASSWORD=$ANALYST
          TL_REFRESH_DAYS=0
          EOF
          echo "ANALYST_PASSWORD=$ANALYST" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$APP" >> "$GITHUB_ENV"

      - name: Start MySQL and Neo4j (runs db/mysql/* at init)
        run: docker compose up -d --wait --wait-timeout 300 mysql neo4j

      - name: Constraint tests
        run: bash db/mysql/tests/check_constraints.sh

      - name: App user has no DDL rights
        run: |
          if docker exec threatlattice-mysql mysql -utl_app -p"$APP_PASSWORD" threatlattice \
               -e "CREATE TABLE ci_probe (id INT)" 2>err.txt; then
            echo "tl_app was allowed to CREATE TABLE"; exit 1
          fi
          grep -q "CREATE command denied" err.txt && echo "CREATE denied for tl_app, as expected"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Neo4j constraints
        run: python -m etl.neo4j_schema
      - name: Demo users
        run: python -m etl.seed_users

      - name: Refresher image builds
        run: docker compose build refresher

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - name: Start the app and check it over HTTP
        working-directory: web
        run: |
          npm start > ../next.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:3000/api/health > /dev/null && break; sleep 1; done

          health=$(curl -fs http://localhost:3000/api/health)
          echo "health: $health"
          echo "$health" | grep -q '"mysql":true' && echo "$health" | grep -q '"neo4j":true'

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
                   -H 'content-type: application/json' -d '{"login":"analyst","password":"wrong-password"}')
          echo "wrong password: $code"; [ "$code" = 401 ]

          body=$(jq -n --arg p "$ANALYST_PASSWORD" '{login: "analyst", password: $p}')
          cookie=$(curl -fs -D - -o /dev/null -X POST http://localhost:3000/api/auth/login \
                     -H 'content-type: application/json' -d "$body" \
                   | grep -i '^set-cookie:' | head -1 | sed -E 's/^[Ss]et-[Cc]ookie: ([^;]*).*/\1/')
          [ -n "$cookie" ] || { echo "no session cookie"; exit 1; }
          me=$(curl -fs http://localhost:3000/api/auth/me -H "cookie: $cookie")
          echo "me: $me"; echo "$me" | grep -q '"analyst"'

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/users -H "cookie: $cookie")
          echo "analyst on an admin API: $code"; [ "$code" = 403 ]

      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail 200 mysql neo4j || true
          cat next.log 2>/dev/null | tail -100 || true
