# ThreatLattice local databases.
#   cp .env.example .env   (then set the passwords)
#   docker compose up -d
#   docker compose down -v   # wipe everything and re-run the init scripts
#
# MySQL runs every top-level file in db/mysql/ (in name order) the first time
# its data volume is created. Sub-folders (queries/, tests/) are not run.
services:
  mysql:
    image: mysql:8.0
    container_name: threatlattice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-threatlattice}
      # read by db/mysql/05_grants.sh to create the least-privilege app user
      MYSQL_APP_USER: ${MYSQL_APP_USER:-tl_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-allowed-packet=64M
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5-community
    container_name: threatlattice-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # browser UI: http://localhost:7474
      - "7687:7687"   # bolt (app + ETL)
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  neo4j-data:
